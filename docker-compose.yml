version: "2"
services:
  app:
    container_name: ethics-net-backend
    restart: always
    build: ./
    environment:
      JWT_SECRET: "${JWT_SECRET:?Supply JWT_SECRET from secure runtime configuration}"
    ports:
      - "80:5000"
    volumes:
      - .:/app
    links:
      - mongo
  mongo:
    container_name: ethics-mongo
    image: mongo
    ports:
      - "27017:27017"